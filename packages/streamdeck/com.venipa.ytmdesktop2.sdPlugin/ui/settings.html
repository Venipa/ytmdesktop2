<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>YTMDesktop2</title>
		<style>
			:root {
				color-scheme: dark;
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 12px;
				color: #eee;
				background: transparent;
			}
			label {
				display: block;
				font-size: 12px;
				margin-bottom: 4px;
			}
			input {
				width: 100%;
				box-sizing: border-box;
				margin-bottom: 10px;
				padding: 6px 8px;
				border-radius: 6px;
				border: 1px solid #444;
				background: #1c1c1c;
				color: #fff;
			}
			button {
				width: 100%;
				margin-top: 6px;
				padding: 8px;
				border: 0;
				border-radius: 6px;
				background: #e03232;
				color: #fff;
				font-weight: 600;
				cursor: pointer;
			}
			button:disabled {
				opacity: 0.55;
				cursor: default;
			}
			button.secondary {
				background: #333;
			}
			.status {
				margin-top: 10px;
				font-size: 12px;
				color: #bbb;
				word-break: break-word;
			}
			.code {
				font-size: 22px;
				letter-spacing: 0.25em;
				font-weight: 700;
				text-align: center;
				margin: 8px 0;
			}
		</style>
	</head>
	<body>
		<label for="host">Host</label>
		<input id="host" value="127.0.0.1" autocomplete="off" />
		<label for="port">Port</label>
		<input id="port" type="number" value="13091" min="9999" max="39999" />
		<button id="save" class="secondary" type="button">Save connection</button>
		<button id="authorize" type="button">Authorize</button>
		<div id="code" class="code" hidden></div>
		<div id="status" class="status">Not connected</div>
		<script>
			const $ = (id) => document.getElementById(id);
			const statusEl = $("status");
			const codeEl = $("code");
			const saveBtn = $("save");
			const authBtn = $("authorize");

			let websocket = null;
			let uuid = null;
			let actionUUID = null;
			let busy = false;

			function setBusy(next) {
				busy = next;
				saveBtn.disabled = next;
				authBtn.disabled = next;
			}

			function applySettings(settings) {
				if (!settings || typeof settings !== "object") return;
				if (settings.host) $("host").value = String(settings.host);
				if (settings.port != null && settings.port !== "") $("port").value = String(settings.port);
				statusEl.textContent =
					settings.status || (settings.token ? "Authorized" : "Not authorized");
				if (settings.authCode) {
					codeEl.hidden = false;
					codeEl.textContent = String(settings.authCode);
				} else {
					codeEl.hidden = true;
					codeEl.textContent = "";
				}
			}

			function sendToPlugin(payload) {
				if (!websocket || websocket.readyState !== WebSocket.OPEN || !uuid || !actionUUID) {
					statusEl.textContent = "Property inspector not connected to plugin";
					return;
				}
				websocket.send(
					JSON.stringify({
						event: "sendToPlugin",
						action: actionUUID,
						context: uuid,
						payload,
					}),
				);
			}

			function getGlobalSettings() {
				if (!websocket || websocket.readyState !== WebSocket.OPEN || !uuid) return;
				websocket.send(JSON.stringify({ event: "getGlobalSettings", context: uuid }));
			}

			window.connectElgatoStreamDeckSocket = (port, inUUID, registerEvent, _info, actionInfo) => {
				uuid = inUUID;
				try {
					actionUUID = JSON.parse(actionInfo).action;
				} catch {
					actionUUID = null;
				}

				websocket = new WebSocket(`ws://127.0.0.1:${port}`);
				websocket.onopen = () => {
					websocket.send(JSON.stringify({ event: registerEvent, uuid: inUUID }));
					getGlobalSettings();
					sendToPlugin({ event: "getSettings" });
				};
				websocket.onmessage = (evt) => {
					let msg;
					try {
						msg = JSON.parse(evt.data);
					} catch {
						return;
					}
					if (msg.event === "didReceiveGlobalSettings") {
						applySettings(msg.payload?.settings);
						return;
					}
					if (msg.event === "sendToPropertyInspector") {
						const payload = msg.payload;
						if (payload?.event === "settings") applySettings(payload.settings);
						else if (payload?.settings) applySettings(payload.settings);
					}
				};
				websocket.onerror = () => {
					statusEl.textContent = "WebSocket error talking to Stream Deck";
				};
			};

			saveBtn.addEventListener("click", () => {
				if (busy) return;
				setBusy(true);
				statusEl.textContent = "Saving…";
				sendToPlugin({
					event: "saveSettings",
					host: $("host").value.trim() || "127.0.0.1",
					port: Number($("port").value) || 13091,
				});
				setTimeout(() => setBusy(false), 800);
			});

			authBtn.addEventListener("click", () => {
				if (busy) return;
				setBusy(true);
				statusEl.textContent = "Waiting for approval in YTMDesktop2…";
				sendToPlugin({ event: "authorize" });
				// Authorize can take up to ~30s while waiting for user approval
				setTimeout(() => setBusy(false), 35_000);
			});
		</script>
	</body>
</html>
