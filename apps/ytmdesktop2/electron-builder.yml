# yaml-language-server: $schema=https://raw.githubusercontent.com/electron-userland/electron-builder/refs/heads/master/packages/app-builder-lib/scheme.json

appId: net.venipa.ytmdesktop
productName: YouTube Music for Desktop
extraMetadata:
  name: YouTube Music for Desktop
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!**/{dist_electron,.github,screenshots}/*"
  - "!{dist_electron,.github,screenshots}/*"
  - "!.*/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.*rc,*.config.js,*.config.ts,*config.json,.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig*.json}"
asarUnpack:
  - resources/**
win:
  executableName: ytmdesktop
  artifactName: ${name}-${version}-setup.${ext}
  compression: maximum
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: true

mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  category: public.app-category.music 
  notarize: true
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: x64
    - target: dmg
      arch: arm64
    - target: zip
      arch: x64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  forceCodeSigning: false
dmg:
  title: "Install or Update ${productName} ${version}"
linux:
  executableName: ytmdesktop2
  description: Unofficial YouTube Music desktop client with Discord RPC, Theming, Last.fm, Streamdeck, and local API.
  target:
    - target: appImage
      arch: x64
    - target: appImage
      arch: arm64
    - target: deb
      arch: x64
    - target: flatpak
      arch: x64
    - target: snap
      arch: x64
  maintainer: youtube-music.app
  category: AudioVideo
  icon: build/icon.icns
flatpak:
  useWaylandFlags: true
  category: AudioVideo
  description: Unofficial YouTube Music desktop client with Discord RPC, Theming, Last.fm, Streamdeck, and local API.
  runtime: org.freedesktop.Platform
  runtimeVersion: "24.08"
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: "24.08"
  finishArgs:
    - --socket=wayland
    - --socket=x11
    - --share=ipc
    - --device=dri
    - --socket=pulseaudio
    - --share=network
    - --filesystem=xdg-music:rw
    - --filesystem=xdg-download:rw
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.gnome.SessionManager
    - --talk-name=org.kde.StatusNotifierWatcher
    - --own-name=org.mpris.MediaPlayer2.ytmdesktop2.*
snapcraft:
  base: core24
  publish:
    - provider: github
  core24:
    confinement: strict
    grade: stable
    summary: YouTube Music for Desktop
    description: Unofficial YouTube Music desktop client with Discord RPC, Last.fm, and local API.
    # core24 allows Wayland by default; set forceX11: true to disable
    useLXD: true
    plugs:
      - browser-support
    executableArgs:
      - --no-sandbox
    slots:
      - mpris:
          name: chromium
# appx:
#   electronUpdaterAware: true
#   addAutoLaunchExtension: true
afterPack: ./scripts/afterPack.js

# Fixed version required in monorepo: install-app-deps cannot resolve
# hoisted root node_modules/electron from apps/ytmdesktop2.
electronVersion: 43.3.0
npmRebuild: false
publish:
  - provider: github
    releaseType: draft
