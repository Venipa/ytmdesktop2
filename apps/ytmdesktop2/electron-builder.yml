# yaml-language-server: $schema=https://raw.githubusercontent.com/electron-userland/electron-builder/refs/heads/master/packages/app-builder-lib/scheme.json

appId: net.venipa.ytmdesktop
productName: YouTube Music for Desktop
extraMetadata:
  name: YouTube Music for Desktop
directories:
  buildResources: build
files:
  - "!**/.vscode/*"
  - "!**/{dist_electron,.github,screenshots}/*"
  - "!{dist_electron,.github,screenshots}/*"
  - "!.*/*"
  - "!src/*"
  - "!electron.vite.config.{js,ts,mjs,cjs}"
  - "!{.*rc,*.config.js,*.config.ts,*config.json,.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{.env,.env.*,.npmrc,pnpm-lock.yaml}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json,tsconfig*.json}"
asarUnpack:
  - resources/**
  # electron-vite may hash asset names — match stem; ICNS needs real path (not asar).
  - "**/*favicon*"
  - "**/*32x32*"
  - "**/*16x16*"
  - "**/*icon*.icns"
  - "**/*.icns"
  - "**/assets/**"
protocols:
  - name: YouTube Music for Desktop
    schemes:
      - ytmd
win:
  executableName: ytmdesktop
  artifactName: ${name}-${version}-setup.${ext}
  compression: maximum
  target:
    - target: nsis
      arch: x64
  icon: build/icon.ico
nsis:
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  installerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  deleteAppDataOnUninstall: true

mac:
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSCameraUsageDescription: Application requests access to the device's camera.
    - NSMicrophoneUsageDescription: Application requests access to the device's microphone.
    - NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    - NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  category: public.app-category.music 
  notarize: true
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: x64
    - target: dmg
      arch: arm64
    - target: zip
      arch: x64
    - target: zip
      arch: arm64
  icon: build/icon.icns
  forceCodeSigning: false
dmg:
  title: "Install or Update ${productName} ${version}"
linux:
  executableName: ytmdesktop2
  synopsis: Unofficial YouTube Music desktop client
  description: Unofficial YouTube Music desktop client with Discord RPC, Theming, Last.fm, Streamdeck, and local API.
  # Match Electron WM_CLASS / app_id to installed .desktop (see package.json desktopName).
  syncDesktopName: true
  # arm64 AppImage built on ubuntu-24.04-arm in CI (release:pack:linux:arm).
  # flatpak/snap are separate CI jobs (release:pack:linux:flatpak|snap).
  target:
    - target: appImage
      arch: x64
    - target: deb
      arch: x64
    - target: pacman
      arch: x64
    - target: flatpak
      arch: x64
    - target: snap
      arch: x64
  # FPM (deb/pacman) author/vendor; must be "Name <email>" (not a bare domain).
  maintainer: "Venipa <admin@venipa.net>"
  vendor: Venipa
  category: AudioVideo
  icon: build/icon.icns
  mimeTypes:
    - x-scheme-handler/ytmd
# Override EB defaults (http-parser is AUR-only; breaks Arch/CachyOS installs).
pacman:
  # Arch package names cannot contain spaces (extraMetadata.name is the product title).
  packageName: ytmdesktop2
  artifactName: ytmdesktop2-${version}.${arch}.${ext}
  maintainer: "Venipa <admin@venipa.net>"
  vendor: Venipa
  # SPDX via package.json license (MIT) is passed to fpm --license automatically.
  depends:
    # Core Electron / GTK
    - gtk3
    - nss
    - at-spi2-core
    - libsecret
    - xdg-utils
    # Display: Wayland + X11 (ozone-platform-hint=auto in app)
    - wayland
    - libxkbcommon
    - libxss
    - libxtst
    # GPU (Flatpak --device=dri)
    - libdrm
    - mesa
    # Audio (Flatpak --socket=pulseaudio; PipeWire-Pulse on CachyOS)
    - libpulse
    - alsa-lib
    # Desktop integration (notifications, tray, MPRIS/session bus)
    - libnotify
    - libayatana-appindicator
    - dbus
flatpak:
  useWaylandFlags: true
  # EB default branch is "master" — shows as Flatpak version/ref without this.
  branch: stable
  # Resolved via buildResources (directories.buildResources: build).
  license: license.txt
  category: AudioVideo
  synopsis: Unofficial YouTube Music desktop client
  description: Unofficial YouTube Music desktop client with Discord RPC, Theming, Last.fm, Streamdeck, and local API.
  runtime: org.freedesktop.Platform
  runtimeVersion: "24.08"
  sdk: org.freedesktop.Sdk
  base: org.electronjs.Electron2.BaseApp
  baseVersion: "24.08"
  # Placeholder — beforePack rewrites to absolute path (flatpak-bundler path.resolve(cwd)).
  files:
    - - build/net.venipa.ytmdesktop.metainfo.xml
      - /share/metainfo/net.venipa.ytmdesktop.metainfo.xml
  finishArgs:
    - --socket=wayland
    - --socket=x11
    - --share=ipc
    - --device=dri
    - --socket=pulseaudio
    - --share=network
    - --filesystem=xdg-music:rw
    - --filesystem=xdg-download:rw
    # Themes / custom.scss under Documents/ytmdesktop
    - --filesystem=xdg-documents/ytmdesktop:create
    # Discord Rich Presence (host Discord IPC sockets)
    - --filesystem=xdg-run/discord-ipc-0
    - --filesystem=xdg-run/discord-ipc-1
    - --filesystem=xdg-run/discord-ipc-2
    - --filesystem=xdg-run/discord-ipc-3
    - --filesystem=xdg-run/discord-ipc-4
    - --filesystem=xdg-run/discord-ipc-5
    - --filesystem=xdg-run/discord-ipc-6
    - --filesystem=xdg-run/discord-ipc-7
    - --filesystem=xdg-run/discord-ipc-8
    - --filesystem=xdg-run/discord-ipc-9
    # Discord Rich Presence (Discord Flatpak: stable / PTB / Canary)
    - --filesystem=xdg-run/app/com.discordapp.Discord:create
    - --filesystem=xdg-run/app/com.discordapp.DiscordPTB:create
    - --filesystem=xdg-run/app/com.discordapp.DiscordCanary:create
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.gnome.SessionManager
    - --talk-name=org.kde.StatusNotifierWatcher
    # Must match MediaControlProvider MPRIS_SERVICE_NAME (xosms). Exact name + instance suffix.
    # Trailing .* alone does NOT allow org.mpris.MediaPlayer2.ytmdesktop2 (no extra segment).
    - --own-name=org.mpris.MediaPlayer2.ytmdesktop2
    - --own-name=org.mpris.MediaPlayer2.ytmdesktop2.*
snapcraft:
  base: core24
  publish:
    - provider: github
  core24:
    category: music
    title: YouTube Music for Desktop
    description: Unofficial YouTube Music desktop client with Discord RPC, Theming, Last.fm, Streamdeck, and local API.
    confinement: strict
    grade: stable
    summary: YouTube Music for Desktop
    # core24 allows Wayland by default; set forceX11: true to disable
    useLXD: true
    # Custom plugs skip EB default browser-support allow-sandbox:true (manual review).
    # Gnome extension still supplies desktop/wayland/opengl/etc.
    plugs:
      - browser-support
      - home
      - network
      - audio-playback
      - documents-ytmdesktop:
          interface: personal-files
          write:
            - $HOME/Documents/ytmdesktop
      - discord-ipc:
          interface: system-files
          write:
            - /run/user/*/discord-ipc-0
            - /run/user/*/discord-ipc-1
            - /run/user/*/discord-ipc-2
            - /run/user/*/discord-ipc-3
            - /run/user/*/discord-ipc-4
            - /run/user/*/discord-ipc-5
            - /run/user/*/discord-ipc-6
            - /run/user/*/discord-ipc-7
            - /run/user/*/discord-ipc-8
            - /run/user/*/discord-ipc-9
            # Discord snap: stable / PTB / Canary
            - /run/user/*/snap.discord
            - /run/user/*/snap.discord-ptb
            - /run/user/*/snap.discord-canary
    executableArgs:
      - --no-sandbox
    slots:
      # xosms owns org.mpris.MediaPlayer2.ytmdesktop2 — NOT Chromium MediaSession ("chromium").
      # Slot name must match MediaControlProvider MPRIS_SERVICE_NAME or AppArmor denies dbus_bind.
      - mpris:
          name: ytmdesktop2
# appx:
#   electronUpdaterAware: true
#   addAutoLaunchExtension: true
beforePack: ./scripts/beforePack.js
afterPack: ./scripts/afterPack.js

# Fixed version required in monorepo: install-app-deps cannot resolve
# hoisted root node_modules/electron from apps/ytmdesktop2.
electronVersion: 43.3.0
npmRebuild: false
publish:
  - provider: github
    releaseType: draft
