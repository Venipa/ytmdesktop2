pre-commit:
  parallel: true
  commands:
    format:
      glob: 
        - apps/ytmdesktop2/src/**/*.{js,jsx,ts,tsx,json,yaml,yml,html,vue}
        - apps/ytmdesktop2/vite.config.ts
        - apps/ytmdesktop2/electron.vite.config.ts
        - apps/ytmdesktop2/postcss.config.js
        - apps/ytmdesktop2/tsconfig.*.json
        - apps/ytmdesktop2/tsconfig.json
        - "!apps/ytmdesktop2/src/**/*.generated.d.ts"
      run: npx @biomejs/biome check --write --no-errors-on-unmatched --files-ignore-unknown=true --colors=off {staged_files}
      stage_fixed: true
