name: Deploy docs to GitHub Pages

on:
  # Docs/workflow changes on default branch, manual run, or nightly rebuild.
  # Nightly rebuild refreshes GitHub data baked into the static Pages export (stars, releases).
  # branches: required so tag pushes (which ignore path filters) do not run this job.
  # Release publishes use docs-on-release.yml → workflow_dispatch on default branch
  # (github-pages env protection rejects tag refs like v1.0.2).
  push:
    branches:
      - master
      - main
    paths:
      - "apps/docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read
  packages: read # @venipa/* on GitHub Packages
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24.14.0
          cache: true
          install: false

      - name: Prepare pnpm / auth
        shell: pwsh
        run: |
          Remove-Item -Path .npmrc -ErrorAction Ignore
          Add-Content -Path .npmrc -Value "registry=https://registry.npmjs.org/"
          Add-Content -Path .npmrc -Value "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
          Add-Content -Path .npmrc -Value "@venipa:registry=https://npm.pkg.github.com"
          Add-Content -Path .npmrc -Value "@venipa/*:registry=https://npm.pkg.github.com"

      - name: Install docs dependencies
        run: pnpm install --frozen-lockfile --filter ytmdesktop2-docs...
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Fetch repo stars
        id: stars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Best-effort: on failure leave empty so the site hides the star count.
          count="$(gh api "repos/${{ github.repository }}" --jq '.stargazers_count' || true)"
          echo "count=${count}" >> "$GITHUB_OUTPUT"

      # Build fetches GitHub releases (stable + prerelease beta/alpha) via GITHUB_TOKEN
      - name: Build static site
        working-directory: apps/docs
        run: pnpm run build:pages
        env:
          GITHUB_PAGES: "true"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_PUBLIC_URL: ${{ steps.pages.outputs.base_url }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          REPO_TITLE: YTMDesktop2
          REPO_BRANCH: ${{ github.event.repository.default_branch }}
          REPO_STARS: ${{ steps.stars.outputs.count }}

      # Release fetch fails soft (empty list); skip the deploy so the last good site stays live.
      # Keep the text in sync with the empty state in apps/docs/app/(home)/changelog/page.tsx.
      - name: Guard against empty release data
        run: |
          if grep -q 'No releases found' apps/docs/out/changelog/index.html; then
            echo "::error::Release data is empty (GitHub API failure?); skipping deploy."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/docs/out
          # build-pages.mjs writes out/.nojekyll (hidden); v5 excludes dotfiles by default
          include-hidden-files: true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
