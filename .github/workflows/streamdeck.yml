name: Stream Deck

on:
  push:
    branches:
      - master
      - main
    paths:
      - "packages/streamdeck/**"
      - ".github/workflows/streamdeck.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: read # @venipa/* on GitHub Packages (if resolved via lockfile)

concurrency:
  group: streamdeck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pack:
    name: Build & pack plugin
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Packages auth
        run: |
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "@venipa:registry=https://npm.pkg.github.com"
            echo "@venipa/*:registry=https://npm.pkg.github.com"
          } > .npmrc

      - name: Install streamdeck dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Only the plugin (+ deps). Skip apps/ytmdesktop2 and @venipa/xosms when possible.
        run: pnpm install --frozen-lockfile --filter ytmdesktop2-streamdeck...

      - name: Pack Stream Deck plugin
        run: pnpm streamdeck:pack

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: ytmdesktop2-streamdeck
          path: dist/streamdeck/*.streamDeckPlugin
          if-no-files-found: error
          retention-days: 30

      # Actions artifacts need auth + expire — publish a dedicated release for public downloads.
      - name: Publish streamdeck-plugin release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: streamdeck-plugin
          name: Stream Deck Plugin
          body: |
            Latest Stream Deck plugin build (`.streamDeckPlugin`).

            Download the file, then double-click / import it in Stream Deck software.

            Docs: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/docs/integrations/streamdeck/
          files: dist/streamdeck/*.streamDeckPlugin
          fail_on_unmatched_files: true
          make_latest: false
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
