name: Release Desktop App

on:
  push:
    tags:
      - "v*"

# One release per tag; do not cancel mid-publish (assets would be partial).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: read # for @venipa/oxsms github hosted package

env:
  NODE_VERSION: "24.14.0"
  COMPILE_ARTIFACT: electron-compile

jobs:
  # Shared electron-vite build — pack jobs skip typecheck + vite.
  compile:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.getVersion.outputs.value }}
      version_ok: ${{ steps.getVersion.outputs.ok }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: github.ref_type == 'tag'
        id: getVersion
        uses: actions/github-script@v9
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const isVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const id = process.env.REF_NAME && process.env.REF_NAME.split('v')[1] || process.env.REF_NAME
            const isRC = id.includes('-rc.')
            core.setOutput("value", id);
            core.setOutput("ok", String(isVersion.test(id)))
            core.setOutput("releaseType", isRC ? 'rc' : 'stable')

      # outputs.ok is the string "true"/"false" — bare `if: outputs.ok` is truthy for "false".
      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok == 'true'
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: apps/ytmdesktop2/package.json
          field: version
          value: ${{ steps.getVersion.outputs.value }}

      - name: Prepare pnpm / auth
        shell: bash
        run: |
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "@venipa:registry=https://npm.pkg.github.com"
            echo "@venipa/*:registry=https://npm.pkg.github.com"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Compile Electron app
        run: pnpm release:compile
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Verify compile output
        shell: bash
        run: test -f apps/ytmdesktop2/out/main/index.js

      # Wildcard → artifact root is out contents. Download into apps/ytmdesktop2/out.
      - name: Upload compile artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/ytmdesktop2/out/**
          if-no-files-found: error
          retention-days: 3

      # Avoid parallel pack jobs racing on release create.
      - name: Ensure draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          title="v${{ steps.getVersion.outputs.value }} - "
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            gh release create "$tag" --draft --title "$title" --notes "Publishing assets…"
          fi

      - name: Upload release source maps to sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ytmdesktop
          SENTRY_ORG: venipa.net
          SENTRY_DEPLOY_ENVIRONMENT: production
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          export SENTRY_RELEASE=$(sentry-cli releases propose-version)
          sentry-cli releases new --project $SENTRY_PROJECT $SENTRY_RELEASE
          sentry-cli releases set-commits --auto $SENTRY_RELEASE
          sentry-cli releases finalize $SENTRY_RELEASE
          sentry-cli releases deploys $SENTRY_RELEASE new -e $SENTRY_DEPLOY_ENVIRONMENT

  build-windows:
    needs: compile
    runs-on: windows-2025-vs2026
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: apps/ytmdesktop2/package.json
          field: version
          value: ${{ needs.compile.outputs.version }}

      - name: Prepare pnpm / auth
        shell: pwsh
        run: |
          Remove-Item -Path .npmrc -ErrorAction Ignore
          Add-Content -Path .npmrc -Value "registry=https://registry.npmjs.org/"
          Add-Content -Path .npmrc -Value "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
          Add-Content -Path .npmrc -Value "@venipa:registry=https://npm.pkg.github.com"
          Add-Content -Path .npmrc -Value "@venipa/*:registry=https://npm.pkg.github.com"

      - name: install windows deps
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.5
        with:
          sdk-version: 20348

      # windows-2025-vs2026 ships VS 2026 (18.x). node-gyp <12.1 cannot detect it
      # (@electron/rebuild used to pull node-gyp@11 → install-app-deps fails on @parcel/watcher).
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          npm_config_msvs_version: "2026"

      # After install — shared vite out from compile job.
      - name: Download compile artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/ytmdesktop2/out

      - name: Verify compile output
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "apps/ytmdesktop2/out/main/index.js")) {
            throw "missing apps/ytmdesktop2/out/main/index.js"
          }

      - name: Pack Windows release
        run: pnpm release:pack:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

  build-macos:
    needs: compile
    runs-on: macos-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: apps/ytmdesktop2/package.json
          field: version
          value: ${{ needs.compile.outputs.version }}

      - name: Prepare pnpm / auth
        shell: bash
        run: |
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "@venipa:registry=https://npm.pkg.github.com"
            echo "@venipa/*:registry=https://npm.pkg.github.com"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download compile artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/ytmdesktop2/out

      - name: Verify compile output
        shell: bash
        run: test -f apps/ytmdesktop2/out/main/index.js

      # Outside Mac App Store: Developer ID Application + notarize (see macos-signing.md)
      # Secrets: MACOS_DEVELOPER_ID_APPLICATION_P12 (+ _PASSWORD),
      #          APPLE_NOTARY_API_KEY_P8, APPLE_NOTARY_API_KEY_ID, APPLE_NOTARY_API_ISSUER_ID
      - name: Prepare Apple notarization key
        run: |
          mkdir -p .secrets
          echo "${{ secrets.APPLE_NOTARY_API_KEY_P8 }}" > .secrets/AuthKey.p8
          chmod 600 .secrets/AuthKey.p8

      - name: Pack macOS release
        run: pnpm release:pack:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          CSC_LINK: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_APPLICATION_PASSWORD }}
          APPLE_API_KEY: ${{ format('{0}/.secrets/AuthKey.p8', github.workspace) }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_NOTARY_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_NOTARY_API_ISSUER_ID }}

      - if: always()
        name: Cleanup Apple secrets
        run: rm -rf .secrets

  # AppImage x64 + deb + pacman — no LXD / flatpak tooling.
  build-linux-core:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: apps/ytmdesktop2/package.json
          field: version
          value: ${{ needs.compile.outputs.version }}

      - name: update apt and install utils
        run: |
          sudo apt update
          sudo apt install -y libdbus-1-dev elfutils libarchive-tools

      - name: Prepare pnpm / auth
        shell: bash
        run: |
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "@venipa:registry=https://npm.pkg.github.com"
            echo "@venipa/*:registry=https://npm.pkg.github.com"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download compile artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/ytmdesktop2/out

      - name: Verify compile output
        shell: bash
        run: test -f apps/ytmdesktop2/out/main/index.js

      - name: Pack Linux core (AppImage/deb/pacman)
        run: pnpm release:pack:linux:core
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

  # Native arm64 AppImage (no x64 cross-compile).
  build-linux-arm:
    needs: compile
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: apps/ytmdesktop2/package.json
          field: version
          value: ${{ needs.compile.outputs.version }}

      - name: update apt and install utils
        run: |
          sudo apt update
          sudo apt install -y libdbus-1-dev elfutils

      - name: Prepare pnpm / auth
        shell: bash
        run: |
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "@venipa:registry=https://npm.pkg.github.com"
            echo "@venipa/*:registry=https://npm.pkg.github.com"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download compile artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/ytmdesktop2/out

      - name: Verify compile output
        shell: bash
        run: test -f apps/ytmdesktop2/out/main/index.js

      - name: Pack Linux arm64 AppImage
        run: pnpm release:pack:linux:arm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

  build-linux-flatpak:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: apps/ytmdesktop2/package.json
          field: version
          value: ${{ needs.compile.outputs.version }}

      - name: update apt and install utils
        run: |
          sudo apt update
          sudo apt install -y libdbus-1-dev elfutils flatpak flatpak-builder

      # System install — matches prior working release; electron-builder flatpak-bundler
      # does not pass --user to flatpak-builder.
      - name: install flatpak runtimes
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub \
            org.freedesktop.Platform/x86_64/24.08 \
            org.freedesktop.Sdk/x86_64/24.08 \
            org.electronjs.Electron2.BaseApp/x86_64/24.08

      - name: Prepare pnpm / auth
        shell: bash
        run: |
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "@venipa:registry=https://npm.pkg.github.com"
            echo "@venipa/*:registry=https://npm.pkg.github.com"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download compile artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/ytmdesktop2/out

      - name: Verify compile output
        shell: bash
        run: test -f apps/ytmdesktop2/out/main/index.js

      - name: Pack Linux Flatpak
        run: pnpm release:pack:linux:flatpak
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

  build-linux-snap:
    needs: compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v2
        with:
          version: 11
          runtime: node@${{ env.NODE_VERSION }}
          cache: true
          install: false

      - if: needs.compile.outputs.version_ok == 'true'
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: apps/ytmdesktop2/package.json
          field: version
          value: ${{ needs.compile.outputs.version }}

      - name: update apt and install utils
        run: |
          sudo apt update
          sudo apt install -y libdbus-1-dev snapd

      - name: install snapcraft + lxd
        run: |
          sudo snap install snapcraft --classic
          # core24 snapcraft.useLXD — LXD must be ready before electron-builder
          sudo snap install lxd
          sudo lxd waitready --timeout=60
          sudo lxd init --auto
          sudo usermod --append --groups lxd "$USER"
          # Docker FORWARD rules break LXD networking on GitHub-hosted runners
          # https://documentation.ubuntu.com/lxd/en/latest/howto/network_bridge_firewalld/
          sudo iptables -I DOCKER-USER -j ACCEPT || true
          sudo iptables -P FORWARD ACCEPT || true
          # newgrp does not work in Actions; sg refreshes group without stripping env
          # https://github.com/actions/runner-images/issues/9932
          sg lxd -c 'lxc info'

      - name: Prepare pnpm / auth
        shell: bash
        run: |
          rm -f .npmrc
          {
            echo "registry=https://registry.npmjs.org/"
            echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
            echo "@venipa:registry=https://npm.pkg.github.com"
            echo "@venipa/*:registry=https://npm.pkg.github.com"
          } >> .npmrc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download compile artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.COMPILE_ARTIFACT }}
          path: apps/ytmdesktop2/out

      - name: Verify compile output
        shell: bash
        run: test -f apps/ytmdesktop2/out/main/index.js

      - name: Pack Linux Snap
        # sg lxd keeps GH_TOKEN/PATH; sudo --user often drops secrets via env_reset.
        run: sg lxd -c 'pnpm release:pack:linux:snap'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}

  finalize-release:
    needs:
      - build-windows
      - build-macos
      - build-linux-core
      - build-linux-arm
      - build-linux-flatpak
      - build-linux-snap
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        shell: bash
        run: |
          tag="${{ github.ref_name }}"
          version="${tag#v}"
          echo "Tag=$tag Version=$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release notes from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          prev=""
          if prev=$(gh release list --exclude-drafts --limit 20 --json tagName --jq ".[] | select(.tagName != \"$tag\") | .tagName" | head -n1); then
            :
          else
            prev=""
          fi

          if [ -z "$prev" ]; then
            prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          fi

          if [ -z "$prev" ]; then
            echo "No previous published release — listing all commits reachable from $tag"
            git log --pretty=tformat:"- %s (%h)" "$tag" > release-notes-commits.txt || true
          else
            echo "Commits: $prev..$tag"
            git log --pretty=tformat:"- %s (%h)" "$prev..$tag" > release-notes-commits.txt || true
          fi

          if [ ! -s release-notes-commits.txt ]; then
            echo "- No commits listed for this range." > release-notes-commits.txt
          fi

          {
            echo "## Changes"
            echo
            cat release-notes-commits.txt
            echo
          } > release-notes.md
          cat release-notes.md

      - name: Set draft release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          tag="${{ steps.version.outputs.tag }}"
          version="${{ steps.version.outputs.version }}"
          gh release edit "$tag" \
            --draft \
            --title "v$version - " \
            --notes-file release-notes.md
