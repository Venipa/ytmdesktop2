name: Release Desktop App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: read # for @venipa/oxsms github hosted package

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2025-vs2026, ubuntu-latest, macos-latest]
        node-version: [24.14.0]

    steps:
      - uses: pnpm/action-setup@v5
        with:
          version: 11
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
        # install dbus-1 dep for xosms
      - if: matrix.os == 'ubuntu-latest'
        name: update apt and install utils
        run: |
          sudo apt update
          sudo apt install libdbus-1-dev elfutils
      - if: matrix.os == 'ubuntu-latest'
        name: install ubuntu snap
        continue-on-error: true
        run: |
          sudo apt install snapd
          sudo snap install snapcraft --classic

      - if: matrix.os == 'ubuntu-latest'
        name: install ubuntu flatpak
        continue-on-error: true
        run: |
          sudo apt install flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - if: matrix.os == 'windows-2025-vs2026'
        name: install windows deps
        uses: GuillaumeFalourd/setup-windows10-sdk-action@v2.4
        with:
          sdk-version: 19041

      # windows-2025-vs2026 ships VS 2026 (18.x). node-gyp <12.1 cannot detect it
      # (@electron/rebuild used to pull node-gyp@11 → install-app-deps fails on @parcel/watcher).
      - if: startsWith(matrix.os, 'windows')
        name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - if: github.ref_type == 'tag'
        id: getVersion
        uses: actions/github-script@v7.0.1
        env:
          REF_NAME: ${{ github.ref_name }}
        with:
          script: |
            const isVersion = /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$/
            const id = process.env.REF_NAME && process.env.REF_NAME.split('v')[1] || process.env.REF_NAME
            const isRC = id.includes('-rc.')
            core.setOutput("value", id);
            core.setOutput("ok", isVersion.test(id))
            core.setOutput("releaseType", isRC ? 'rc' : 'stable')
      - if: github.ref_type == 'tag' && steps.getVersion.outputs.ok
        name: set app version
        uses: jossef/action-set-json-field@v2.2
        with:
          file: apps/ytmdesktop2/package.json
          field: version
          value: ${{ steps.getVersion.outputs.value }}
      - name: Prepare pnpm / auth
        shell: pwsh
        run: |
          # Auth/registry only in .npmrc. Hoist settings live in pnpm-workspace.yaml
          # (shamefullyHoist + nodeLinker: hoisted) — required for Electron/pnpm CI builds.
          Remove-Item -Path .npmrc -ErrorAction Ignore
          Add-Content -Path .npmrc -Value "registry=https://registry.npmjs.org/"
          Add-Content -Path .npmrc -Value "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}"
          Add-Content -Path .npmrc -Value "@venipa:registry=https://npm.pkg.github.com"
          Add-Content -Path .npmrc -Value "@venipa/*:registry=https://npm.pkg.github.com"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Hint for node-gyp 12.1+ / 13.x on windows-2025-vs2026 (VS 18.x)
          npm_config_msvs_version: "2026"
      # Outside Mac App Store: Developer ID Application + notarize (see macos-signing.md)
      # Secrets: MACOS_DEVELOPER_ID_APPLICATION_P12 (+ _PASSWORD),
      #          APPLE_NOTARY_API_KEY_P8, APPLE_NOTARY_API_KEY_ID, APPLE_NOTARY_API_ISSUER_ID
      # Not needed: Mac App Store certs, Developer ID Installer (no .pkg)
      - if: matrix.os == 'macos-latest'
        name: Prepare Apple notarization key
        run: |
          mkdir -p .secrets
          echo "${{ secrets.APPLE_NOTARY_API_KEY_P8 }}" > .secrets/AuthKey.p8
          chmod 600 .secrets/AuthKey.p8

      - name: Build Electron release
        run: pnpm release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          VITE_LASTFM_API: ${{ secrets.LASTFM_API }}
          VITE_LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          VITE_GITHUB_REPOSITORY: ${{ github.repository }}
          # electron-builder code signing (Developer ID Application .p12) — macOS only
          CSC_LINK: ${{ matrix.os == 'macos-latest' && secrets.MACOS_DEVELOPER_ID_APPLICATION_P12 || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'macos-latest' && secrets.MACOS_DEVELOPER_ID_APPLICATION_PASSWORD || '' }}
          # electron-builder notarize: true → notarytool via App Store Connect API key
          APPLE_API_KEY: ${{ matrix.os == 'macos-latest' && format('{0}/.secrets/AuthKey.p8', github.workspace) || '' }}
          APPLE_API_KEY_ID: ${{ matrix.os == 'macos-latest' && secrets.APPLE_NOTARY_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ matrix.os == 'macos-latest' && secrets.APPLE_NOTARY_API_ISSUER_ID || '' }}
      - if: always() && matrix.os == 'macos-latest'
        name: Cleanup Apple secrets
        run: rm -rf .secrets
      - if: matrix.os == 'ubuntu-latest'
        name: Upload release source maps to sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_PROJECT: ytmdesktop
          SENTRY_ORG: venipa.net
          SENTRY_DEPLOY_ENVIRONMENT: production
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_URL: ${{ secrets.SENTRY_URL }}
        run: |
          # Install Sentry CLI
          curl -sL https://sentry.io/get-cli/ | bash

          # Create new Sentry release
          export SENTRY_RELEASE=$(sentry-cli releases propose-version)
          sentry-cli releases new --project $SENTRY_PROJECT $SENTRY_RELEASE
          sentry-cli releases set-commits --auto $SENTRY_RELEASE
          sentry-cli releases finalize $SENTRY_RELEASE

          # Create new deploy for this Sentry release
          sentry-cli releases deploys $SENTRY_RELEASE new -e $SENTRY_DEPLOY_ENVIRONMENT

  finalize-release:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Parse version from tag
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = if ($tag.StartsWith("v")) { $tag.Substring(1) } else { $tag }
          Write-Host "Tag=$tag Version=$version"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build release notes from commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $prev = ""
          try {
            $releases = gh release list --exclude-drafts --limit 20 --json tagName | ConvertFrom-Json
            $prev = ($releases | Where-Object { $_.tagName -ne $tag } | Select-Object -First 1).tagName
          } catch {
            $prev = ""
          }

          if ([string]::IsNullOrWhiteSpace($prev)) {
            $prev = (git describe --tags --abbrev=0 "$($tag)^" 2>$null | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { $prev = "" }
          }

          if ([string]::IsNullOrWhiteSpace($prev)) {
            Write-Host "No previous published release — listing all commits reachable from $tag"
            $lines = @(git log --pretty=tformat:"- %s (%h)" $tag)
          }
          else {
            Write-Host "Commits: $prev..$tag"
            $lines = @(git log --pretty=tformat:"- %s (%h)" "$prev..$tag")
          }

          if ($lines.Count -eq 0 -or ($lines.Count -eq 1 -and [string]::IsNullOrWhiteSpace($lines[0]))) {
            $lines = @("- No commits listed for this range.")
          }

          # git log as string[] must be joined explicitly — "$array" uses spaces, not newlines.
          $commits = ($lines | ForEach-Object { $_.TrimEnd() }) -join "`n"
          $body = "## Changes`n`n$commits`n"
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "release-notes.md"),
            $body,
            [System.Text.UTF8Encoding]::new($false))
          Get-Content release-notes.md -Raw

      - name: Set draft release title and notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $version = "${{ steps.version.outputs.version }}"
          gh release edit $tag `
            --draft `
            --title "v$version - " `
            --notes-file release-notes.md
