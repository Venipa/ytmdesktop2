packages:
  - "apps/*"
  - "packages/*"

# Required for Electron app installs/builds under pnpm (CI + local).
shamefullyHoist: true
nodeLinker: hoisted
onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@parcel/watcher'
  - '@sentry/cli'
  - 'electron-winstaller'
  - electron
  - esbuild
  - lefthook
  - sharp

allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  bufferutil: true
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  utf-8-validate: true

# @electron/rebuild@4 pulls node-gyp@11 which cannot detect VS 2026 (18.x).
# node-gyp >=12.1 required on windows-2025-vs2026 runners.
# node-abi <4.32 cannot resolve Electron 43 ABI (installAppDeps / @electron/rebuild).
overrides:
  node-gyp: ^13.0.1
  node-abi: ^4.33.0

# xosms ships NAPI binaries as optional platform packages. Install all of them
# so electron-builder pack jobs (and Vite require-scan) are not host-OS-only.
supportedArchitectures:
  os:
    - current
    - win32
    - darwin
    - linux
  cpu:
    - current
    - x64
    - arm64
  libc:
    - current
    - glibc
