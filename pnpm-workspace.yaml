packages:
  - "apps/*"
  - "packages/*"

# Required for Electron app installs/builds under pnpm (CI + local).
shamefullyHoist: true
nodeLinker: hoisted
onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@parcel/watcher'
  - 'electron-winstaller'
  - electron
  - esbuild
  - lefthook
  - sharp

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  bufferutil: true
  electron: true
  electron-winstaller: true
  esbuild: true
  lefthook: true
  sharp: true
  utf-8-validate: true

# @electron/rebuild@4 pulls node-gyp@11 which cannot detect VS 2026 (18.x).
# node-gyp >=12.1 required on windows-2025-vs2026 runners.
overrides:
  node-gyp: ^13.0.1
